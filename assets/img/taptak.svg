<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Pretendard',sans-serif">
  <rect width="800" height="500" fill="#eaf6f2"/>
  <!-- 폰 -->
  <rect x="300" y="60" width="200" height="380" rx="30" fill="#ffffff" stroke="#1f9d8b" stroke-width="4"/>
  <rect x="300" y="60" width="200" height="58" rx="30" fill="#1f9d8b"/>
  <rect x="300" y="88" width="200" height="30" fill="#1f9d8b"/>
  <text x="400" y="99" fill="#ffffff" font-size="24" font-weight="800" text-anchor="middle" letter-spacing="1">TAP TAK</text>
  <!-- 큰 버튼 3개 -->
  <g text-anchor="middle" font-weight="700">
    <rect x="322" y="140" width="156" height="72" rx="16" fill="#ffe08a"/>
    <text x="400" y="184" fill="#5a4a17" font-size="22">📞 간단통화</text>
    <rect x="322" y="224" width="156" height="72" rx="16" fill="#bfe6dd"/>
    <text x="400" y="268" fill="#1c5c52" font-size="22">🛒 계산대</text>
    <rect x="322" y="308" width="156" height="72" rx="16" fill="#cfe3ff"/>
    <text x="400" y="352" fill="#1c4a86" font-size="22">🗺️ 지도</text>
  </g>
  <!-- 탭 물결 + 손가락 -->
  <g transform="translate(400,346)">
    <circle r="34" fill="none" stroke="#1f9d8b" stroke-width="3" opacity="0.5"/>
    <circle r="52" fill="none" stroke="#1f9d8b" stroke-width="2" opacity="0.28"/>
  </g>
  <text x="150" y="250" font-size="42" font-weight="800" fill="#1f9d8b" text-anchor="middle">탭하면</text>
  <text x="150" y="300" font-size="42" font-weight="800" fill="#e08a2b" text-anchor="middle">탁!</text>
</svg>
